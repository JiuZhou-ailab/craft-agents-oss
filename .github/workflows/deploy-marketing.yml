# input: Website and versioned release-note changes, Cloudflare Pages credentials
# output: Tested production landing build deployed to Cloudflare Pages
# pos: Canonical deployment boundary for apps/marketing

name: Deploy Marketing

on:
  push:
    branches:
      - main
    paths:
      - "apps/marketing/**"
      - "apps/electron/resources/release-notes/*.md"
      - "scripts/build-marketing.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy-marketing.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: deploy-marketing-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Verify deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test marketing downloads
        run: bun test apps/marketing/src/__tests__/downloads.test.ts

      - name: Build marketing site
        run: bun run marketing:build

      - name: Deploy marketing site to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          STORYFLOW_PAGES_PROJECT_NAME: ${{ vars.STORYFLOW_PAGES_PROJECT_NAME || 'storyflow' }}
        run: |
          bunx wrangler pages deploy apps/marketing/dist \
            --project-name "$STORYFLOW_PAGES_PROJECT_NAME" \
            --branch main
