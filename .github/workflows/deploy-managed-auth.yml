# input: Optional deploy intent plus managed-auth signing secrets and Cloudflare deployment authority
# output: Optionally deployed auth, model, and tool services followed by their live capability canaries
# pos: Shared managed-auth deployment and verification boundary; Skills Market deploys independently
name: Deploy managed auth

on:
  workflow_call:
    inputs:
      deploy:
        description: "Deploy managed services before running live verification"
        required: false
        default: true
        type: boolean
      verify_skills_market_auth:
        description: "Run the Broker → Skills Registry positive auth canary even without deploying"
        required: false
        default: false
        type: boolean
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      STORYFLOW_CLIENT_SESSION_JWT_CURRENT_SECRET:
        required: true
      STORYFLOW_GATEWAY_JWT_CURRENT_SECRET:
        required: false
      STORYFLOW_SKILLS_MARKET_JWT_CURRENT_SECRET:
        required: false
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy managed services before running live verification"
        required: false
        default: true
        type: boolean
      verify_skills_market_auth:
        description: "Run the Broker → Skills Registry positive auth canary even without deploying"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-managed-auth
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_MANAGED_AUTH: ${{ inputs.deploy }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify deployment inputs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          STORYFLOW_CLIENT_SESSION_JWT_CURRENT_SECRET: ${{ secrets.STORYFLOW_CLIENT_SESSION_JWT_CURRENT_SECRET }}
          STORYFLOW_GATEWAY_JWT_CURRENT_SECRET: ${{ secrets.STORYFLOW_GATEWAY_JWT_CURRENT_SECRET }}
          STORYFLOW_SKILLS_MARKET_JWT_CURRENT_SECRET: ${{ secrets.STORYFLOW_SKILLS_MARKET_JWT_CURRENT_SECRET }}
        run: |
          set -euo pipefail
          for name in STORYFLOW_CLIENT_SESSION_JWT_CURRENT_SECRET; do
            test -n "${!name}" || { echo "Missing $name"; exit 1; }
          done
          if [ "$DEPLOY_MANAGED_AUTH" = "true" ]; then
            for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID STORYFLOW_GATEWAY_JWT_CURRENT_SECRET STORYFLOW_SKILLS_MARKET_JWT_CURRENT_SECRET; do
              test -n "${!name}" || { echo "Missing $name"; exit 1; }
            done
            test "$STORYFLOW_CLIENT_SESSION_JWT_CURRENT_SECRET" != "$STORYFLOW_GATEWAY_JWT_CURRENT_SECRET" \
              || { echo "Client-session and model-access secrets must differ"; exit 1; }
            test "$STORYFLOW_SKILLS_MARKET_JWT_CURRENT_SECRET" != "$STORYFLOW_CLIENT_SESSION_JWT_CURRENT_SECRET" \
              && test "$STORYFLOW_SKILLS_MARKET_JWT_CURRENT_SECRET" != "$STORYFLOW_GATEWAY_JWT_CURRENT_SECRET" \
              || { echo "Skills Market signing secret must be independent"; exit 1; }
          fi

      - name: Test managed auth contract
        if: ${{ inputs.deploy }}
        run: |
          bun test \
            apps/auth-broker-worker/src/index.test.ts \
            apps/model-gateway-worker/src/index.test.ts \
            apps/model-gateway-worker/src/managed-auth-flow.test.ts \
            apps/tool-gateway-worker/src/index.test.ts

      - name: Deploy model gateway
        if: ${{ inputs.deploy }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          STORYFLOW_GATEWAY_JWT_CURRENT_SECRET: ${{ secrets.STORYFLOW_GATEWAY_JWT_CURRENT_SECRET }}
        run: |
          set -euo pipefail
          printf '%s' "$STORYFLOW_GATEWAY_JWT_CURRENT_SECRET" \
            | bunx wrangler@4.114.0 secret put STORYFLOW_GATEWAY_JWT_CURRENT_SECRET \
                --config apps/model-gateway-worker/wrangler.toml >/dev/null
          bunx wrangler@4.114.0 deploy --config apps/model-gateway-worker/wrangler.toml

      - name: Verify model gateway
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            https://storyflow-model.zjding.com/ready >/dev/null
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/gateway-negative.json" \
            --write-out '%{http_code}' \
            -H 'Authorization: Bearer invalid' \
            -H 'Content-Type: application/json' \
            -d '{}' \
            https://storyflow-model.zjding.com/v1/chat/completions)"
          test "$status" = 401
          grep -q '"code":"model_access_token_invalid"' "$RUNNER_TEMP/gateway-negative.json"

      - name: Deploy tool gateway
        if: ${{ inputs.deploy }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler@4.123.0 deploy --config apps/tool-gateway-worker/wrangler.toml

      - name: Verify tool gateway
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            https://storyflow-tools.zjding.com/ready >/dev/null
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/tool-gateway-negative.json" \
            --write-out '%{http_code}' \
            -H 'Authorization: Bearer invalid' \
            -H 'Content-Type: application/json' \
            -d '{"query":"release canary","count":1}' \
            https://storyflow-tools.zjding.com/v1/search)"
          test "$status" = 401
          grep -q '"code":"tool_access_token_invalid"' "$RUNNER_TEMP/tool-gateway-negative.json"

      - name: Deploy auth broker
        if: ${{ inputs.deploy }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          STORYFLOW_CLIENT_SESSION_JWT_CURRENT_SECRET: ${{ secrets.STORYFLOW_CLIENT_SESSION_JWT_CURRENT_SECRET }}
          STORYFLOW_GATEWAY_JWT_CURRENT_SECRET: ${{ secrets.STORYFLOW_GATEWAY_JWT_CURRENT_SECRET }}
          STORYFLOW_SKILLS_MARKET_JWT_CURRENT_SECRET: ${{ secrets.STORYFLOW_SKILLS_MARKET_JWT_CURRENT_SECRET }}
        run: |
          set -euo pipefail
          printf '%s' "$STORYFLOW_CLIENT_SESSION_JWT_CURRENT_SECRET" \
            | bunx wrangler@4.114.0 secret put STORYFLOW_CLIENT_SESSION_JWT_CURRENT_SECRET \
                --config apps/auth-broker-worker/wrangler.toml >/dev/null
          printf '%s' "$STORYFLOW_GATEWAY_JWT_CURRENT_SECRET" \
            | bunx wrangler@4.114.0 secret put STORYFLOW_GATEWAY_JWT_CURRENT_SECRET \
                --config apps/auth-broker-worker/wrangler.toml >/dev/null
          printf '%s' "$STORYFLOW_SKILLS_MARKET_JWT_CURRENT_SECRET" \
            | bunx wrangler@4.114.0 secret put STORYFLOW_SKILLS_MARKET_JWT_CURRENT_SECRET \
                --config apps/auth-broker-worker/wrangler.toml >/dev/null
          bunx wrangler@4.114.0 deploy --config apps/auth-broker-worker/wrangler.toml

      - name: Verify managed auth integration
        env:
          STORYFLOW_CLIENT_SESSION_JWT_CURRENT_SECRET: ${{ secrets.STORYFLOW_CLIENT_SESSION_JWT_CURRENT_SECRET }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            https://storyflow-auth.zjding.com/ready >/dev/null
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/broker-negative.json" \
            --write-out '%{http_code}' \
            -X POST https://storyflow-auth.zjding.com/api/client-auth/token)"
          test "$status" = 401
          grep -q '"code":"client_session_token_invalid"' "$RUNNER_TEMP/broker-negative.json"

          APP_SESSION_TOKEN="$(bun --eval '
            import { SignJWT } from "jose";
            const now = Math.floor(Date.now() / 1000);
            console.log(await new SignJWT({
              scope: "capability:issue",
              model_tier: "standard",
              auth_time: now,
              user_name: "Release Canary",
              organization_id: "release-canary-company",
            })
              .setProtectedHeader({ alg: "HS256", typ: "JWT", kid: "client-session-2026-07" })
              .setIssuer("storyflow-auth-broker")
              .setAudience("storyflow-client-auth")
              .setSubject("release-canary")
              .setIssuedAt(now)
              .setExpirationTime(now + 90 * 24 * 60 * 60)
              .sign(new TextEncoder().encode(process.env.STORYFLOW_CLIENT_SESSION_JWT_CURRENT_SECRET)));
          ')"

          status="$(curl --silent --show-error --output "$RUNNER_TEMP/token-response.json" \
            --write-out '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $APP_SESSION_TOKEN" \
            https://storyflow-auth.zjding.com/api/client-auth/token)"
          test "$status" = 200
          MODEL_ACCESS_TOKEN="$(TOKEN_RESPONSE_PATH="$RUNNER_TEMP/token-response.json" bun --eval '
            import { decodeJwt } from "jose";
            const body = await Bun.file(process.env.TOKEN_RESPONSE_PATH).json();
            if (typeof body.modelAccessToken !== "string") process.exit(1);
            const payload = decodeJwt(body.modelAccessToken);
            const now = Math.floor(Date.now() / 1000);
            if (typeof payload.exp !== "number" || payload.exp - now <= 12 * 60 * 60 + 5 * 60) process.exit(1);
            console.log(body.modelAccessToken);
          ')"

          status="$(curl --silent --show-error --output "$RUNNER_TEMP/model-catalog-response.json" \
            --write-out '%{http_code}' \
            -H "Authorization: Bearer $MODEL_ACCESS_TOKEN" \
            https://storyflow-model.zjding.com/v1/models)"
          test "$status" = 200
          MODEL_CATALOG_RESPONSE_PATH="$RUNNER_TEMP/model-catalog-response.json" bun --eval '
            const body = await Bun.file(process.env.MODEL_CATALOG_RESPONSE_PATH).json();
            if (!Array.isArray(body.data) || body.data.length === 0) process.exit(1);
            const available = new Set(body.data.flatMap((model) =>
              model && typeof model === "object" && typeof model.id === "string" ? [model.id] : []
            ));
            for (const model of ["gemini-3.8-flash", "gemini-3.7-flash"]) {
              if (!available.has(model)) {
                console.error(`Missing managed release model: ${model}`);
                process.exit(1);
              }
            }
          '

          for model in gemini-3.8-flash gemini-3.7-flash; do
            response_path="$RUNNER_TEMP/gemini-canary-$model.json"
            status="$(curl --silent --show-error --max-time 60 --output "$response_path" \
              --write-out '%{http_code}' \
              -H "x-goog-api-key: $MODEL_ACCESS_TOKEN" \
              -H 'Content-Type: application/json' \
              -d '{"contents":[{"role":"user","parts":[{"text":"Reply with OK."}]}],"generationConfig":{"maxOutputTokens":64,"thinkingConfig":{"thinkingLevel":"low"}}}' \
              "https://storyflow-model.zjding.com/v1beta/models/$model:generateContent")"
            test "$status" = 200
            GEMINI_CANARY_RESPONSE_PATH="$response_path" GEMINI_CANARY_MODEL="$model" bun --eval '
              const body = await Bun.file(process.env.GEMINI_CANARY_RESPONSE_PATH).json();
              const generated = body.candidates?.some((candidate) =>
                candidate?.content?.parts?.some((part) => typeof part?.text === "string" && part.text.trim())
              );
              if (!generated) {
                console.error(`No generated text for ${process.env.GEMINI_CANARY_MODEL}`);
                process.exit(1);
              }
            '
          done

          status="$(curl --silent --show-error --output "$RUNNER_TEMP/tool-token-response.json" \
            --write-out '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $APP_SESSION_TOKEN" \
            https://storyflow-auth.zjding.com/api/client-auth/tools/token)"
          test "$status" = 200
          TOOL_ACCESS_TOKEN="$(TOOL_TOKEN_RESPONSE_PATH="$RUNNER_TEMP/tool-token-response.json" bun --eval '
            import { decodeJwt } from "jose";
            const body = await Bun.file(process.env.TOOL_TOKEN_RESPONSE_PATH).json();
            if (typeof body.toolAccessToken !== "string") process.exit(1);
            const payload = decodeJwt(body.toolAccessToken);
            if (!payload.scopes?.includes("web:search")) process.exit(1);
            console.log(body.toolAccessToken);
          ')"

          status="$(curl --silent --show-error --output "$RUNNER_TEMP/tool-search-response.json" \
            --write-out '%{http_code}' \
            -H "Authorization: Bearer $TOOL_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"query":"Storyflow release canary","count":1}' \
            https://storyflow-tools.zjding.com/v1/search)"
          test "$status" = 200
          TOOL_SEARCH_RESPONSE_PATH="$RUNNER_TEMP/tool-search-response.json" bun --eval '
            const body = await Bun.file(process.env.TOOL_SEARCH_RESPONSE_PATH).json();
            if (!Array.isArray(body.results) || body.results.length === 0) process.exit(1);
          '

      - name: Verify Skills Market auth integration
        if: ${{ inputs.deploy || inputs.verify_skills_market_auth }}
        env:
          STORYFLOW_CLIENT_SESSION_JWT_CURRENT_SECRET: ${{ secrets.STORYFLOW_CLIENT_SESSION_JWT_CURRENT_SECRET }}
        run: bun run scripts/verify-skills-market-auth.ts
